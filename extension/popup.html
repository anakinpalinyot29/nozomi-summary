<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hd">
    <span class="hd-icon">🤖</span>
    <div>
      <div class="hd-title">Nozomi SOAR Robot</div>
      <div class="hd-sub">export กะ → Excel · SOC OT</div>
    </div>
  </header>

  <main class="bd">
    <div class="status-row">
      <span class="chip" id="chip-tab">tab: —</span>
      <span class="chip" id="chip-org">org: —</span>
      <button class="chip chip-user hidden" id="chip-user" type="button" title="เปลี่ยนชื่อ">👤 <span id="chip-user-name"></span></button>
    </div>

    <label class="field name-field hidden" id="name-field">
      <span class="field-label">ชื่อของคุณ (ถามครั้งเดียว)</span>
      <input type="text" id="name-input" maxlength="100" placeholder="เช่น Somchai" autocomplete="name">
      <span class="name-notice">ระบบบันทึกชื่อ, เวลา, ชื่อไฟล์ และจำนวนแถว เพื่อดูสถิติการใช้งาน — ไม่เก็บเนื้อหา alert</span>
    </label>

    <label class="field">
      <span class="field-label">วันที่ (เริ่มกะ)</span>
      <input type="date" id="date-input">
    </label>

    <div class="field">
      <span class="field-label">กะ</span>
      <div class="shift-btns" role="group" aria-label="เลือกกะ">
        <button class="shift-btn active" data-shift="Day"   id="sb-day">☀️ Day</button>
        <button class="shift-btn"        data-shift="Night" id="sb-night">🌙 Night</button>
        <button class="shift-btn"        data-shift="Full"  id="sb-full">📅 ทั้งวัน</button>
      </div>
    </div>

    <button class="cta" id="btn-export">⚡ Export &amp; Download</button>

    <div class="status" id="status" aria-live="polite">
      เปิดแท็บ Vantage (ล็อกอินแล้ว) แล้วเลือกกะ+วันที่
    </div>
  </main>

  <script src="lib/xlsx.bundle.js"></script>
  <script src="src/shifts.js"></script>
  <script src="src/normalize.js"></script>
  <script src="src/audit.js"></script>
  <script src="popup.js"></script>
</body>
</html>
